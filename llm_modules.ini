# Defaults 
[default]
provider = gemini
model    = gemini-2.5-flash

# Parsing module
[parse]
provider = anthropic
model    = claude-opus-4-8
; provider = local_lm
; model    = qwen3.6-8k

# DTS patch module
[dts_patch]
provider = anthropic
model    = claude-opus-4-8

# LLM orchestrator — drives the chat agentic tool-use loop (decides when/how many
# times to call the solver). Hard module: multi-step reasoning + tool use.
[orchestrator]
provider = anthropic
model    = claude-opus-4-8
