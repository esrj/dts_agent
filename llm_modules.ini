# Defaults 
[default]
provider = anthropic
model    = claude-opus-5

# Knowledge extraction — input/ 手冊 -> 知識庫抽取（src/knowledge_extract）。
# 大量表格結構化,量大、單塊難度中等:抽取品質不夠時可改便宜長上下文模型。
[knowledge_extract]
provider = anthropic
model    = claude-opus-5

# Parsing module
[parse]
provider = anthropic
model    = claude-opus-5
; provider = local_lm
; model    = qwen3.6-8k

# DTS patch module
[dts_patch]
provider = anthropic
model    = claude-opus-5

# LLM orchestrator — drives the chat agentic tool-use loop (decides when/how many
# times to call the solver). Hard module: multi-step reasoning + tool use.
[orchestrator]
provider = anthropic
model    = claude-opus-5
